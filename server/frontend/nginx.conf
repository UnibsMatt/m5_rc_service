# Client-cert CN from the RFC 2253 subject DN (e.g. "CN=pc-94px994,O=...").
map $ssl_client_s_dn $client_cn {
    default "";
    "~(^|,)CN=(?<cn>[^,]+)" $cn;
}

# ---- dashboard (HTTP, read-only API) -----------------------------------------
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        limit_except GET { deny all; }            # ingest only via the mTLS port
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Client-CN "";           # never trust client-supplied values
        proxy_set_header X-Client-Verify "";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ---- ingest for the gw-monitor api connector (HTTPS + client certificates) -----
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate         /certs/server.crt;
    ssl_certificate_key     /certs/server.key;
    ssl_client_certificate  /certs/client-ca.crt;   # CA(s) that sign gateway certs
    # Ask every client for a cert and record the verification result; the API
    # decides what to accept (CLIENT_CERT_POLICY = verified | present | off).
    ssl_verify_client       optional_no_ca;
    ssl_verify_depth        3;
    ssl_protocols           TLSv1.2 TLSv1.3;

    location = /api/v1/reports {
        limit_except POST PUT { deny all; }
        client_max_body_size 256k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Client-CN $client_cn;
        proxy_set_header X-Client-Verify $ssl_client_verify;
    }

    location / { return 404; }
}
